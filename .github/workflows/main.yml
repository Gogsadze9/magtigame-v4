name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and find game
        run: |
          ls -la
          ZIP=$(ls *.zip | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Unzipping $ZIP"
            unzip -o "$ZIP" -d extracted
            GAME_HTML=$(find extracted -name "index.html" | head -n 1)
            echo "Found $GAME_HTML"
            cp "$GAME_HTML" ./found_index.html
          elif [ -f "app/src/main/assets/game/index.html" ]; then
            cp app/src/main/assets/game/index.html ./found_index.html
          else
            cp index.html ./found_index.html
          fi
          wc -c ./found_index.html
          ls -lh ./found_index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/assets/game app/src/main/java/com/magti/game
          cp ./found_index.html app/src/main/assets/game/index.html
          cat > settings.gradle.kts << 'SETTINGS_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MagtiGame"
          include(":app")
          SETTINGS_EOF
          cat > build.gradle.kts << 'ROOT_EOF'
          plugins { id("com.android.application") version "8.5.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.24" apply false }
          ROOT_EOF
          cat > app/build.gradle.kts << 'APP_EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android { namespace = "com.magti.game"; compileSdk = 34; defaultConfig { applicationId = "com.magti.game"; minSdk = 24; targetSdk = 34; versionCode = 1; versionName = "1.0" }; buildTypes { release { isMinifyEnabled = false } }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }; kotlinOptions { jvmTarget = "17" } }
          dependencies { implementation("androidx.core:core-ktx:1.13.1"); implementation("androidx.appcompat:appcompat:1.7.0") }
          APP_EOF
          cat > gradle.properties << 'PROP_EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          PROP_EOF
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="Magti Game" android:theme="@style/Theme.AppCompat.NoActionBar" android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST_EOF
          cat > app/src/main/java/com/magti/game/MainActivity.kt << 'KOTLIN_EOF'
          package com.magti.game
          import android.os.Bundle
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.view.WindowManager
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              window.setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN)
              window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              val webView = WebView(this)
              setContentView(webView)
              val s: WebSettings = webView.settings
              s.javaScriptEnabled = true
              s.domStorageEnabled = true
              s.mediaPlaybackRequiresUserGesture = false
              webView.webViewClient = WebViewClient()
              webView.loadUrl("file:///android_asset/game/index.html")
            }
          }
          KOTLIN_EOF
          ls -R

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MagtiGame-APK
          path: app/build/outputs/apk/debug/app-debug.apk
